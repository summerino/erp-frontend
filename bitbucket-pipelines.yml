#  Template NodeJS build

#  The workflow allows bulding on the development branch.

image: node:17

pipelines:
  branches:
    development:
      - step:
          name: Build
          script:
            - npm install
            # build frontend object
            - export NODE_OPTIONS=--openssl-legacy-provider
            - npm run build
            # build frontend sms object
            - export VUE_APP_API_BASE_URL=$SMS_API_BASE_URL
            - npm run build -- --dest .dist_sms/
          artifacts:
            - dist/**
            - dist_sms/**
      - step:
          name: Deploy to Tested
          deployment: Test
          runs-on:
            - self.hosted
            - windows
            - shsdev.rw
          script:
            # deploy frontend object
            - $site_path=(Get-IISSite "$Env:SITE_NAME").Applications.VirtualDirectories.PhysicalPath
            - C:\Windows\System32\inetsrv\appcmd.exe stop sites "$Env:SITE_NAME"
            - Get-ChildItem -Path "$site_path" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            - Copy-Item -Path "dist\*" -Destination "$site_path" -Recurse -Force -ErrorAction SilentlyContinue
            - C:\Windows\System32\inetsrv\appcmd.exe start sites "$Env:SITE_NAME"
            # deploy frontend sms object
            - $site_path=(Get-IISSite "$Env:SMS_SITE_NAME").Applications.VirtualDirectories.PhysicalPath
            - C:\Windows\System32\inetsrv\appcmd.exe stop sites "$Env:SMS_SITE_NAME"
            - Get-ChildItem -Path "$site_path" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            - Copy-Item -Path "dist_sms\*" -Destination "$site_path" -Recurse -Force -ErrorAction SilentlyContinue
            - C:\Windows\System32\inetsrv\appcmd.exe start sites "$Env:SMS_SITE_NAME"